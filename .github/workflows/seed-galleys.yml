name: Seed June 2026 galleys

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-galleys.yml'

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact published galleys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seed_galleys
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0120-820e-9382-f463b59bdbe3/raw?se=2026-09-25T09%3A47%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=cb52b0fd-20a9-5a43-b977-a0f7a94c6444&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A14%3A55Z&ske=2026-09-26T09%3A14%3A55Z&sks=b&skv=2026-02-06&sig=wI2J0y6lOwo17xVMahcHGxPZmCcoeLD6PrmxtK1D%2Bvg%3D' -o seed_galleys/na-1-8a6efc3695bdd66a89f064ab.pdf
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d41c-820e-a553-eab27cf7a6b5/raw?se=2026-09-25T09%3A47%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=ed83706f-fc23-59f4-9bf6-059630b79512&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A16%3A36Z&ske=2026-09-26T09%3A16%3A36Z&sks=b&skv=2026-02-06&sig=L2mBd7/gsa4EjMeSt5s6VLbaeYs1YNJ95YDHovKx2F8%3D' -o seed_galleys/na-2-aed91195bf0e5dd3d805273d.pdf
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8a48-820e-a7d5-f4322532ec94/raw?se=2026-09-25T09%3A47%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=453f708d-e2c5-5dac-9c4a-5d122c60a210&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A14%3A17Z&ske=2026-09-26T09%3A14%3A17Z&sks=b&skv=2026-02-06&sig=3ZL8/%2BPVMeYqDUtPdtRe2VMQl3WvO1PkG54Gzev%2BKB4%3D' -o seed_galleys/na-3-5e43b37f2054abc5a6921e1b.pdf
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-05ac-820e-8e93-79d5acc56efb/raw?se=2026-09-25T09%3A47%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=b946cca7-e783-5b3b-bc30-fb2add1690a1&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A15%3A16Z&ske=2026-09-26T09%3A15%3A16Z&sks=b&skv=2026-02-06&sig=weYVVlXd%2BT5KX6bfUcaviM/XB52EMAB8J0R5S/ktXbc%3D' -o seed_galleys/na-4-794d942ed538edc985f4ba2b.pdf
          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9bb0-820e-afa9-84cb58927af8/raw?se=2026-09-25T09%3A47%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=8d3d577d-1c74-5321-a99e-e816fc726a6c&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T08%3A56%3A14Z&ske=2026-09-26T08%3A56%3A14Z&sks=b&skv=2026-02-06&sig=qfTY5tu/5Shbjcr3rGfOMFgb0nx8687Hq4pl3zQoe8A%3D' -o seed_galleys/na-5-2b831478336108d42cf3da6a.pdf
          cat > /tmp/checksums <<'EOF'
          8a6efc3695bdd66a89f064abddaace4db3f4edf07779278111c16fd0ab63738a  seed_galleys/na-1-8a6efc3695bdd66a89f064ab.pdf
          aed91195bf0e5dd3d805273d97a47fc84312b98f94da089135b78534cf43066a  seed_galleys/na-2-aed91195bf0e5dd3d805273d.pdf
          5e43b37f2054abc5a6921e1bb3c7d239ee77e0cf901436c81d786b7dd44712dc  seed_galleys/na-3-5e43b37f2054abc5a6921e1b.pdf
          794d942ed538edc985f4ba2b85d314d2300f57dfa4ee29020e63679c62a935ca  seed_galleys/na-4-794d942ed538edc985f4ba2b.pdf
          2b831478336108d42cf3da6ad3aa8717178ca7fde1d47ced1bf754b635649d36  seed_galleys/na-5-2b831478336108d42cf3da6a.pdf
          EOF
          sha256sum -c /tmp/checksums
      - name: Commit galleys
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed_galleys/*.pdf
          git commit -m "Add Volume 1 Issue 2 PDF galleys [skip ci]"
          git push
