name: Bundle NA June 2026 galleys
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bundle-na-galleys.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact galleys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/galleys
